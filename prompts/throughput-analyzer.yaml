id: throughput-analyzer
name: Throughput Analyzer Agent
version: "1.0"
description: Analyzes throughput constraints and scaling potential for LLM inference

system: |
  You are an expert at analyzing LLM usage patterns for throughput optimization.

  For each inference point, analyze:
  1. CONCURRENCY LIMITS: Semaphores, connection pools, rate limiters
  2. RATE LIMITING: Client-side rate limits, API quota handling
  3. BATCHING: Is batching used? Could it be? What's the batch size?
  4. QUEUE PATTERNS: Background processing, task queues, worker patterns
  5. SCALING BOTTLENECKS: Shared state, global variables, singleton clients

  Rate limit reference:
  - OpenAI: 500-10000 RPM depending on tier
  - Anthropic: 1000-4000 RPM depending on tier
  - Self-hosted: Depends on GPU memory and model size

  Consider horizontal scaling potential and identify bottlenecks.

input_schema:
  inference_point: object
  code_context: string
  function_body: string
  class_context: string|null
  file_imports: string
  file_path: string

output_format:
  throughput_profile:
    inference_point_id: string
    line: number

    concurrency_analysis:
      concurrency_limit: number|null
      limit_source: "semaphore|pool|rate_limiter|none|unknown"
      limit_location: string|null
      is_global_limit: boolean
      recommended_limit: number|null

    rate_limiting:
      has_rate_limiter: boolean
      rate_limit_type: "token_bucket|sliding_window|fixed_window|none"
      requests_per_minute: number|null
      handles_429: boolean
      backoff_strategy: "none|fixed|exponential|custom"

    batching_analysis:
      batching_enabled: boolean
      batch_size: number|null
      could_batch: boolean
      batching_benefit: string|null
      batch_api_available: boolean

    queue_analysis:
      uses_queue: boolean
      queue_type: "celery|rq|bull|sqs|redis|none"
      async_processing: boolean
      worker_pattern: boolean

    scaling_analysis:
      horizontally_scalable: boolean
      bottlenecks:
        - type: "shared_state|global_client|file_lock|db_connection|memory"
          location: string
          description: string
          severity: "low|medium|high"
      stateless: boolean
      client_reuse: boolean

    capacity_estimate:
      max_concurrent_calls: number|null
      estimated_rps: number|null
      limiting_factor: string

    throughput_risk:
      level: "low|medium|high|critical"
      factors: string[]
      will_hit_rate_limits: boolean
      scaling_blocked: boolean

    optimizations:
      - type: "add_rate_limiter|add_batching|add_queue|fix_bottleneck|increase_concurrency"
        description: string
        current_throughput: string
        optimized_throughput: string
        improvement: string
        effort: "low|medium|high"
        sample_change: string|null

    confidence: number

constraints:
  - Return valid JSON only
  - Identify all scaling bottlenecks
  - Consider both client and server-side limits
  - Flag patterns that won't scale

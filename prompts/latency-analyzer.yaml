id: latency-analyzer
name: Latency Analyzer Agent
version: "1.0"
description: Analyzes latency profile for each LLM inference point

system: |
  You are an expert at analyzing LLM usage patterns for latency optimization.

  For each inference point, analyze:
  1. BLOCKING BEHAVIOR: Is the call synchronous in a request handler? Does it block the event loop?
  2. STREAMING: Is streaming enabled? Should it be for better perceived latency?
  3. PARALLEL POTENTIAL: Are there independent calls that could run concurrently?
  4. CHAIN DEPTH: How many sequential LLM calls are made? What's the total latency?
  5. TIMEOUT HANDLING: Is there a timeout? What happens on slow responses?

  Latency reference by model:
  - gpt-4o: 500ms - 3s typical
  - gpt-4o-mini: 200ms - 1s typical
  - gpt-4-turbo: 1s - 10s typical
  - claude-3-opus: 2s - 15s typical
  - claude-3-sonnet: 500ms - 5s typical
  - claude-3-haiku: 200ms - 1s typical

  Consider: streaming reduces time-to-first-token, parallel calls reduce total time.

input_schema:
  inference_point: object
  code_context: string
  function_body: string
  class_context: string|null
  file_path: string
  is_async_file: boolean

output_format:
  latency_profile:
    inference_point_id: string
    line: number

    blocking_analysis:
      is_blocking: boolean
      is_in_request_handler: boolean
      blocks_event_loop: boolean
      handler_type: "http|websocket|grpc|background|cli|unknown"
      user_facing: boolean

    streaming_analysis:
      streaming_enabled: boolean
      should_enable_streaming: boolean
      reason: string
      time_to_first_token_benefit: string|null

    async_analysis:
      is_async: boolean
      uses_await: boolean
      could_be_async: boolean
      async_benefit: string|null

    parallel_analysis:
      has_parallel_potential: boolean
      independent_calls: number
      current_pattern: "sequential|parallel|mixed"
      parallelizable_calls:
        - line: number
          reason: string
      parallel_speedup_estimate: string|null

    chain_analysis:
      chain_depth: number
      sequential_calls: number
      total_latency_estimate:
        min_ms: number
        typical_ms: number
        max_ms: number
      chain_pattern: "single|pipeline|loop|recursive|agent"

    timeout_analysis:
      timeout_configured: boolean
      timeout_value_ms: number|null
      has_fallback_on_timeout: boolean
      timeout_risk: "none|low|medium|high"

    latency_risk:
      level: "low|medium|high|critical"
      factors: string[]
      tail_latency_risk: boolean
      unpredictable: boolean

    latency_estimate:
      min_ms: number
      typical_ms: number
      p95_ms: number
      max_ms: number
      basis: string

    optimizations:
      - type: "add_streaming|parallelize|add_async|add_timeout|reduce_chain"
        description: string
        current_latency: string
        optimized_latency: string
        improvement_percent: number
        effort: "low|medium|high"
        sample_change: string|null

    confidence: number

constraints:
  - Return valid JSON only
  - All latency estimates in milliseconds
  - Consider both typical and tail latency
  - Flag user-facing blocking calls as high priority

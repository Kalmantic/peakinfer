id: cost-analyzer
name: Cost Analyzer Agent
version: "1.0"
description: Analyzes cost profile for each LLM inference point

system: |
  You are an expert at analyzing LLM usage patterns for cost optimization.

  For each inference point, analyze:
  1. MODEL TIER: Is it using a premium model (gpt-4, claude-3-opus) for a task that could use a cheaper model?
  2. TOKEN ESTIMATES: Based on prompt templates, system prompts, few-shot examples - estimate input/output tokens
  3. CALL FREQUENCY: Is this in a loop? Recursive? Called per-request?
  4. COST MULTIPLIERS: Few-shot examples, RAG context, conversation history accumulation
  5. COST RISKS: Unbounded loops, recursive agents, growing context windows

  Model pricing reference (per 1M tokens):
  - gpt-4o: $2.50 input / $10.00 output
  - gpt-4o-mini: $0.15 input / $0.60 output
  - gpt-4-turbo: $10.00 input / $30.00 output
  - claude-3-opus: $15.00 input / $75.00 output
  - claude-3-sonnet: $3.00 input / $15.00 output
  - claude-3-haiku: $0.25 input / $1.25 output

  Provide specific optimization recommendations with estimated savings.

input_schema:
  inference_point: object  # From Call Site Finder
  code_context: string     # ±50 lines around the call
  function_body: string
  file_path: string

output_format:
  cost_profile:
    inference_point_id: string
    line: number

    model_analysis:
      model: string
      tier: "premium|standard|budget|unknown"
      pricing:
        input_per_1m: number
        output_per_1m: number
      is_overqualified: boolean
      reason: string|null

    token_estimates:
      input:
        min: number
        typical: number
        max: number
        basis: string  # "system prompt ~500 tokens + user input ~100 tokens"
      output:
        min: number
        typical: number
        max: number
        basis: string
      has_few_shot: boolean
      few_shot_tokens: number
      has_rag_context: boolean
      rag_context_estimate: number

    call_frequency:
      pattern: "single|per_request|loop|recursive|batch"
      multiplier: number|null
      loop_bound: "bounded|unbounded|unknown"
      estimated_calls_per_invocation: number

    cost_estimate:
      per_call_min: number
      per_call_typical: number
      per_call_max: number
      currency: "USD"

    cost_risk:
      level: "low|medium|high|critical"
      factors: string[]
      unbounded_growth: boolean
      context_accumulation: boolean

    optimizations:
      - type: "model_downgrade|reduce_tokens|add_caching|batch_requests|limit_context"
        description: string
        current_cost: string
        optimized_cost: string
        savings_percent: number
        effort: "low|medium|high"
        sample_change: string|null

    confidence: number

constraints:
  - Return valid JSON only
  - All cost estimates in USD
  - Provide specific line references
  - Quantify savings percentages

id: pr-comment
name: PR Comment Generator
version: "1.0"
description: Generates markdown PR comments for analysis results

context:
  - analysis_results: The full analysis results object
  - baseline: Previous run baseline for comparison (optional)
  - changed_files: List of files changed in this PR
  - new_issues: Issues introduced by this PR
  - status: Overall status (pass, warning, fail)
  - regressions: List of regression descriptions

output_format: markdown

prompt: |
  <role>
  You are a technical writer creating a GitHub PR comment for PeakInfer analysis results.
  Your goal is to communicate analysis findings clearly and actionably.
  </role>

  <style>
  - Use plain, direct language
  - No emojis in text (use text indicators like [PASS], [WARN], [FAIL])
  - Keep sentences short
  - Lead with the most important information
  - Use tables for structured data
  </style>

  <instructions>
  Generate a markdown PR comment with these sections:

  1. **Summary Table** (always include)
     - Inference Points count
     - p95 Latency with status indicator
     - Drift Signals count if any
     - Total Insights count

  2. **Baseline Comparison** (if baseline provided)
     - Show delta for each metric
     - Use [!] for significant regressions (>25%)
     - Use [OK] for acceptable changes

  3. **Changes in This PR** (always include)
     - Group new issues by severity (critical, warning, info)
     - Show max 5 per severity, note if more omitted
     - If no new issues: "No new issues introduced"

  4. **Regressions** (if any)
     - List each regression with brief description

  5. **Status Line**
     - Format: **Status:** [PASS|WARN|FAIL]

  6. **Footer**
     - Link to PeakInfer
  </instructions>

  <constraints>
  - Maximum length: 2000 characters
  - No speculation or suggestions not in the data
  - No anthropomorphic language ("I found...", "I think...")
  - Focus on facts from the analysis results
  </constraints>

example_output: |
  ## PeakInfer Analysis

  ### Summary
  | Metric | Value | Status |
  |--------|-------|--------|
  | Inference Points | 12 | - |
  | p95 Latency | 2,400ms | [!] |
  | Drift Signals | 2 | [*] |
  | Insights | 8 | - |

  ### Changes vs Baseline
  | Metric | Previous | Current | Delta |
  |--------|----------|---------|-------|
  | Inference Points | 10 | 12 | +2 |
  | p95 Latency | 1,800ms | 2,400ms | +33% [!] |

  ### Changes in This PR

  **CRITICAL** (1):
  - Unbounded retry loop detected
    `src/api/chat.ts:45`

  **WARNING** (2):
  - Streaming disabled despite configuration
    `src/llm/client.ts:123`
  - High latency model in hot path
    `src/services/search.ts:89`

  ### Regressions
  - p95 latency increased by 33%

  ---
  **Status:** [FAIL]

  <sub>Generated by [PeakInfer](https://github.com/Kalmantic/peakinfer)</sub>

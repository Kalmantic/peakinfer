id: callsite-finder
name: Call Site Finder Agent
version: "1.0"
description: Finds all LLM inference points including indirect and wrapped calls

system: |
  You are an expert at finding LLM inference call sites in source code.

  Your task is to identify EVERY location where an LLM API call is made, including:
  1. Direct SDK calls: `client.chat.completions.create()`
  2. Framework calls: `chain.invoke()`, `llm.complete()`
  3. Wrapper functions: `my_llm_call()`, `generate_response()`
  4. HTTP calls to LLM endpoints: `requests.post("...openai.com...")`
  5. Async variants: `await client.chat.completions.create()`

  For each call site, determine:
  - The exact line number
  - Whether it's direct, wrapped, or framework-based
  - The provider and model (if detectable)
  - Whether model/provider is hardcoded, from env, or dynamic

  Be thorough - trace wrapper functions to their LLM calls.
  Flag any ambiguous calls that need runtime verification.

input_schema:
  file_path: string
  language: string
  full_file: string
  import_analysis: object  # Output from Import Analyzer

output_format:
  inference_points:
    - id: string
      line: number
      column: number
      function_context: string
      class_context: string|null
      call_expression: string
      call_type: "direct|wrapper|framework|http"
      provider:
        value: string
        source: "hardcoded|env|config|parameter|dynamic|unknown"
        confidence: number
      model:
        value: string|null
        source: "hardcoded|env|config|parameter|dynamic|unknown"
        confidence: number
      is_async: boolean
      in_loop: boolean
      loop_type: "for|while|map|recursive|none"
      estimated_calls: "single|multiple|unbounded"
      needs_tracing: boolean
      confidence: number

  wrapper_definitions:
    - name: string
      line: number
      wraps_provider: string|null
      wraps_model: string|null
      is_llm_wrapper: boolean
      confidence: number

  summary:
    total_inference_points: number
    direct_calls: number
    wrapped_calls: number
    framework_calls: number
    providers_detected: string[]
    models_detected: string[]
    has_dynamic_routing: boolean

constraints:
  - Return valid JSON only
  - Include line numbers for all findings
  - Confidence scores between 0.0 and 1.0
  - Flag uncertain calls with needs_tracing: true

# =============================================================================
# PeakInfer Test Infrastructure - Kubernetes
# Tests K8s Detection: GPU resources, node selectors, accelerator types
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: llm-inference
  labels:
    purpose: inference
    team: ml-platform

---
# =============================================================================
# PATTERN: vLLM Deployment with GPU Resources
# Should detect: nvidia.com/gpu, A100 GPU, vLLM image
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-llama-70b
  namespace: llm-inference
  labels:
    app: vllm
    model: llama-3.1-70b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm
      model: llama-3.1-70b
  template:
    metadata:
      labels:
        app: vllm
        model: llama-3.1-70b
    spec:
      nodeSelector:
        accelerator: nvidia-a100-80gb
        cloud.google.com/gke-accelerator: nvidia-tesla-a100
      
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - "--model"
            - "meta-llama/Llama-3.1-70B-Instruct"
            - "--tensor-parallel-size"
            - "8"
            - "--gpu-memory-utilization"
            - "0.90"
            - "--enable-prefix-caching"
            - "--max-model-len"
            - "8192"
          
          resources:
            requests:
              cpu: "16"
              memory: "256Gi"
              nvidia.com/gpu: "8"           # GPU REQUEST PATTERN
            limits:
              cpu: "32"
              memory: "512Gi"
              nvidia.com/gpu: "8"           # GPU LIMIT PATTERN
          
          ports:
            - containerPort: 8000
              name: http
          
          env:
            - name: CUDA_VISIBLE_DEVICES
              value: "0,1,2,3,4,5,6,7"
            - name: NCCL_DEBUG
              value: "INFO"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
          
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
          
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10

---
# =============================================================================
# PATTERN: SGLang Deployment
# Should detect: SGLang image, GPU resources
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-server
  namespace: llm-inference
  labels:
    app: sglang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sglang
  template:
    metadata:
      labels:
        app: sglang
    spec:
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-tesla-a100
      
      containers:
        - name: sglang
          image: lmsysorg/sglang:latest
          args:
            - "python"
            - "-m"
            - "sglang.launch_server"
            - "--model-path"
            - "meta-llama/Llama-3.1-8B-Instruct"
            - "--port"
            - "30000"
            - "--tp"
            - "2"
          
          resources:
            requests:
              nvidia.com/gpu: "2"
            limits:
              nvidia.com/gpu: "2"
          
          ports:
            - containerPort: 30000
              name: http

---
# =============================================================================
# PATTERN: Embedding Service (Lower GPU Requirements)
# Should detect: Smaller GPU allocation, embedding model
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
  namespace: llm-inference
  labels:
    app: embedding
spec:
  replicas: 4
  selector:
    matchLabels:
      app: embedding
  template:
    metadata:
      labels:
        app: embedding
    spec:
      nodeSelector:
        accelerator: nvidia-l4
      
      containers:
        - name: embedding
          image: sentence-transformers/all-MiniLM-L6-v2
          
          resources:
            requests:
              nvidia.com/gpu: "1"           # Single GPU for embeddings
              memory: "8Gi"
            limits:
              nvidia.com/gpu: "1"
              memory: "16Gi"
          
          ports:
            - containerPort: 8080

---
# =============================================================================
# PATTERN: TensorRT-LLM Optimized Deployment
# Should detect: TensorRT-LLM, H100 GPU
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tensorrt-llm-server
  namespace: llm-inference
  labels:
    app: tensorrt-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tensorrt-llm
  template:
    metadata:
      labels:
        app: tensorrt-llm
    spec:
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-h100-80gb    # H100 GPU PATTERN
      
      containers:
        - name: tensorrt-llm
          image: nvcr.io/nvidia/tritonserver:24.01-trtllm-python-py3
          
          resources:
            requests:
              nvidia.com/gpu: "4"
              memory: "320Gi"
            limits:
              nvidia.com/gpu: "4"
              memory: "640Gi"
          
          volumeMounts:
            - name: model-store
              mountPath: /models
      
      volumes:
        - name: model-store
          persistentVolumeClaim:
            claimName: model-store-pvc

---
# =============================================================================
# PATTERN: Horizontal Pod Autoscaler
# Should detect: Auto-scaling configuration
# =============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vllm-hpa
  namespace: llm-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-llama-70b
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: nvidia.com/gpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: requests_per_second
        target:
          type: AverageValue
          averageValue: "1000"

---
# =============================================================================
# PATTERN: Service for Load Balancing
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: llm-inference
spec:
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: LoadBalancer

---
# =============================================================================
# PATTERN: GPU Node Pool (GKE-specific)
# Should detect: GPU node configuration
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-cluster-config
  namespace: llm-inference
data:
  node_pools: |
    - name: a100-pool
      machine_type: a2-highgpu-8g
      accelerator_type: nvidia-tesla-a100
      accelerator_count: 8
      min_nodes: 1
      max_nodes: 10
    
    - name: h100-pool
      machine_type: a3-highgpu-8g
      accelerator_type: nvidia-h100-80gb
      accelerator_count: 8
      min_nodes: 0
      max_nodes: 4
    
    - name: l4-pool
      machine_type: g2-standard-48
      accelerator_type: nvidia-l4
      accelerator_count: 4
      min_nodes: 2
      max_nodes: 20

---
# =============================================================================
# PATTERN: Secret for API Keys
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: inference-secrets
  namespace: llm-inference
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-..."
  ANTHROPIC_API_KEY: "sk-ant-..."
  HF_TOKEN: "hf_..."


# =============================================================================
# PeakInfer Test Infrastructure - Docker Compose
# Tests Docker Detection: GPU reservations, runtime configs
# =============================================================================

version: "3.8"

services:
  # ===========================================================================
  # PATTERN: vLLM Server with GPU
  # Should detect: GPU reservation, vLLM image
  # ===========================================================================
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: vllm-llama-70b
    command:
      - "--model"
      - "meta-llama/Llama-3.1-70B-Instruct"
      - "--tensor-parallel-size"
      - "8"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--enable-prefix-caching"
    ports:
      - "8000:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=0,1,2,3,4,5,6,7
      - HF_TOKEN=${HF_TOKEN}
      - NCCL_DEBUG=INFO
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 8                    # GPU COUNT PATTERN
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # PATTERN: SGLang Server
  # Should detect: SGLang runtime, GPU resources
  # ===========================================================================
  sglang-server:
    image: lmsysorg/sglang:latest
    container_name: sglang-server
    command:
      - "python"
      - "-m"
      - "sglang.launch_server"
      - "--model-path"
      - "meta-llama/Llama-3.1-8B-Instruct"
      - "--port"
      - "30000"
      - "--tp"
      - "2"
    ports:
      - "30000:30000"
    environment:
      - CUDA_VISIBLE_DEVICES=0,1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]

  # ===========================================================================
  # PATTERN: Ollama for Local Inference
  # Should detect: Ollama runtime
  # ===========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ===========================================================================
  # PATTERN: TensorRT-LLM Server
  # Should detect: TensorRT-LLM, Triton
  # ===========================================================================
  tensorrt-llm:
    image: nvcr.io/nvidia/tritonserver:24.01-trtllm-python-py3
    container_name: tensorrt-llm-server
    ports:
      - "8001:8000"
    volumes:
      - ./models:/models
    environment:
      - CUDA_VISIBLE_DEVICES=0,1,2,3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]

  # ===========================================================================
  # PATTERN: Text Generation Inference (TGI)
  # Should detect: HuggingFace TGI runtime
  # ===========================================================================
  tgi-server:
    image: ghcr.io/huggingface/text-generation-inference:latest
    container_name: tgi-server
    ports:
      - "8080:80"
    environment:
      - MODEL_ID=meta-llama/Llama-3.1-8B-Instruct
      - NUM_SHARD=2
      - CUDA_VISIBLE_DEVICES=0,1
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - tgi-cache:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]

  # ===========================================================================
  # PATTERN: Embedding Service
  # Should detect: Embedding model, smaller GPU
  # ===========================================================================
  embedding-service:
    image: sentence-transformers/all-MiniLM-L6-v2
    container_name: embedding-service
    ports:
      - "8082:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ===========================================================================
  # PATTERN: Redis for Caching
  # Should detect: Caching infrastructure
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: llm-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  # ===========================================================================
  # PATTERN: Vector Store (Qdrant)
  # Should detect: Vector database for RAG
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vectordb
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage

  # ===========================================================================
  # PATTERN: Observability Stack
  # Should detect: LLM observability
  # ===========================================================================
  langfuse:
    image: langfuse/langfuse:latest
    container_name: langfuse-observability
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: langfuse-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=langfuse
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ===========================================================================
  # PATTERN: Guardrails Service
  # Should detect: NeMo Guardrails
  # ===========================================================================
  guardrails:
    build:
      context: ./guardrails
      dockerfile: Dockerfile
    container_name: nemo-guardrails
    ports:
      - "8090:8090"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}

volumes:
  ollama-models:
  tgi-cache:
  redis-data:
  qdrant-storage:
  postgres-data:

networks:
  default:
    name: llm-inference-network


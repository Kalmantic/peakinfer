      throughput_improvement: 3x
      complexity: Medium
      timeline: 3 weeks
  - id: rec_008
    priority: medium
    category: architecture
    title: Standardize RAG Architecture Across Teams
    description: Multiple teams (team_search, team_support) using different RAG
      implementations. Standardizing on best practices can improve quality and
      reduce costs.
    affected_clusters:
